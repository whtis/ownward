name: core-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Keep CI on the Bun version used by the verified macOS release workflow;
      # setup-bun otherwise follows latest and can change test timing/semantics.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.17"
      - run: bun install --frozen-lockfile
      - run: ./verify.sh
