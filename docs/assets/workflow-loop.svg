<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Ownward work loop</title>
  <desc id="desc">A six-step loop: capture events, triage, execute a task, record facts, curate memory with a human, and carry context into the next task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080f1d"/><stop offset="1" stop-color="#111e37"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56d3ff"/><stop offset="1" stop-color="#3976ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a69bff"/><stop offset="1" stop-color="#4d64e8"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6689bd" stroke-opacity=".08"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5fd0ff"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a69bff"/></marker>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="758" rx="27" fill="url(#grid)" stroke="#2a4777"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="77" font-size="38" font-weight="800" fill="#f1f6ff">The Ownward work loop</text>
    <text x="74" y="110" font-size="16" fill="#91a8cb">Capture what happened. Keep the useful facts. Start the next turn with context.</text>

    <!-- loop track -->
    <path d="M255 367 C270 220 446 150 590 176 C756 113 1003 158 1113 316 C1201 442 1116 602 978 635 C800 695 601 693 435 642 C285 596 222 485 255 367Z" fill="none" stroke="#29466f" stroke-width="5" stroke-dasharray="10 12"/>
    <path d="M293 308 C338 224 440 193 515 195" fill="none" stroke="#5fd0ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M770 176 C879 162 997 205 1064 282" fill="none" stroke="#5fd0ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M1116 457 C1088 555 1021 600 956 617" fill="none" stroke="#a69bff" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M711 676 C602 680 499 664 426 631" fill="none" stroke="#a69bff" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M274 483 C257 437 260 402 266 378" fill="none" stroke="#5fd0ff" stroke-width="3" marker-end="url(#arrowBlue)"/>

    <!-- center beacon -->
    <circle cx="700" cy="390" r="143" fill="#1b355b" opacity=".4" filter="url(#glow)"/>
    <circle cx="700" cy="390" r="117" fill="#10233f" stroke="#4ca7df" stroke-width="2"/>
    <circle cx="700" cy="390" r="91" fill="none" stroke="#335e94" stroke-width="1"/>
    <circle cx="700" cy="345" r="14" fill="url(#cyan)"/>
    <path d="M693 345h14M700 338v14" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/>
    <text x="700" y="390" text-anchor="middle" font-size="23" font-weight="800" fill="#f2f7ff">One durable</text>
    <text x="700" y="418" text-anchor="middle" font-size="23" font-weight="800" fill="#f2f7ff">work history</text>
    <text x="700" y="448" text-anchor="middle" font-size="13" fill="#9bb9dc">Task · Run · Session · Vault</text>

    <!-- step cards -->
    <g filter="url(#shadow)">
      <!-- 1 -->
      <rect x="108" y="330" width="220" height="117" rx="16" fill="#132944" stroke="#3e79b2"/>
      <circle cx="136" cy="361" r="17" fill="url(#cyan)"/><text x="136" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#081426">01</text>
      <text x="166" y="360" font-size="18" font-weight="750" fill="#f0f7ff">Capture</text>
      <text x="132" y="390" font-size="12" fill="#96b1d3">mail · GitHub · Lark · stock</text>
      <text x="132" y="410" font-size="12" fill="#96b1d3">or a task from phone / web</text>
      <!-- 2 -->
      <rect x="374" y="126" width="237" height="112" rx="16" fill="#132944" stroke="#3e79b2"/>
      <circle cx="403" cy="157" r="17" fill="url(#cyan)"/><text x="403" y="162" text-anchor="middle" font-size="14" font-weight="800" fill="#081426">02</text>
      <text x="433" y="156" font-size="18" font-weight="750" fill="#f0f7ff">Triage</text>
      <text x="399" y="185" font-size="12" fill="#96b1d3">decision rules turn events</text>
      <text x="399" y="205" font-size="12" fill="#96b1d3">into Actions worth attention</text>
      <!-- 3 -->
      <rect x="814" y="124" width="260" height="114" rx="16" fill="#20254c" stroke="#6e72c3"/>
      <circle cx="844" cy="156" r="17" fill="url(#purple)"/><text x="844" y="161" text-anchor="middle" font-size="14" font-weight="800" fill="#10132d">03</text>
      <text x="874" y="155" font-size="18" font-weight="750" fill="#f5f4ff">Execute</text>
      <text x="840" y="185" font-size="12" fill="#c2c5e8">Runner hands the turn to</text>
      <text x="840" y="205" font-size="12" fill="#c2c5e8">Claude Code · Codex · CodeBuddy</text>
      <!-- 4 -->
      <rect x="1102" y="329" width="220" height="117" rx="16" fill="#132944" stroke="#3e79b2"/>
      <circle cx="1130" cy="360" r="17" fill="url(#cyan)"/><text x="1130" y="365" text-anchor="middle" font-size="14" font-weight="800" fill="#081426">04</text>
      <text x="1160" y="359" font-size="18" font-weight="750" fill="#f0f7ff">Record</text>
      <text x="1126" y="389" font-size="12" fill="#96b1d3">Run + Flight Record capture</text>
      <text x="1126" y="409" font-size="12" fill="#96b1d3">diff, tools, result, conclusion</text>
      <!-- 5 -->
      <rect x="810" y="568" width="270" height="114" rx="16" fill="#20254c" stroke="#6e72c3"/>
      <circle cx="841" cy="600" r="17" fill="url(#purple)"/><text x="841" y="605" text-anchor="middle" font-size="14" font-weight="800" fill="#10132d">05</text>
      <text x="871" y="599" font-size="18" font-weight="750" fill="#f5f4ff">Curate</text>
      <text x="837" y="629" font-size="12" fill="#c2c5e8">Useful long-term knowledge waits</text>
      <text x="837" y="649" font-size="12" fill="#c2c5e8">in _candidates/ for human review</text>
      <!-- 6 -->
      <rect x="364" y="568" width="266" height="114" rx="16" fill="#132944" stroke="#3e79b2"/>
      <circle cx="395" cy="600" r="17" fill="url(#cyan)"/><text x="395" y="605" text-anchor="middle" font-size="14" font-weight="800" fill="#081426">06</text>
      <text x="425" y="599" font-size="18" font-weight="750" fill="#f0f7ff">Continue</text>
      <text x="391" y="629" font-size="12" fill="#96b1d3">next task and Routine reuse</text>
      <text x="391" y="649" font-size="12" fill="#96b1d3">the project’s current truth</text>
    </g>

    <!-- legend / guardrail -->
    <g transform="translate(74 719)">
      <rect x="0" y="-16" width="10" height="10" rx="2" fill="#5fd0ff"/><text x="18" y="-6" font-size="12" fill="#94aed0">automatic collection</text>
      <rect x="172" y="-16" width="10" height="10" rx="2" fill="#a69bff"/><text x="190" y="-6" font-size="12" fill="#94aed0">human checkpoint</text>
      <text x="1050" y="-6" font-size="12" fill="#708db7">No silent publish · no lost hand-off</text>
    </g>
  </g>
</svg>
