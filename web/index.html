<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ownward</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111720'/%3E%3Cpath d='M4 11 8 4l4 7' stroke='%2363a8ff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='9' r='1.2' fill='%2347c7f4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/vertical-navigation.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" id="meta-theme" content="#e9eef3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ownward">
<script>
/* 皮肤预应用：首屏绘制前恢复缓存的皮肤，避免闪原生色（正式逻辑在 skin.js，这里只回放缓存） */
(function () {
  try {
    var b = JSON.parse(localStorage.getItem("ownward-skin-boot") || "null");
    if (!b) { if (localStorage.getItem("ownward-theme") === "light") document.documentElement.dataset.theme = "light"; return; }
    var d = document.documentElement, hex = /^#[0-9a-fA-F]{6}$/;
    if (b.mode === "light") d.dataset.theme = "light"; else delete d.dataset.theme;
    if (hex.test(b.accent || "")) d.style.setProperty("--accent", b.accent);
    if (hex.test(b.accent2 || "")) d.style.setProperty("--accent-2", b.accent2);
    if (b.wp && /^(linear|radial|conic)-gradient\([^;{}<>]*\)$|^url\("\/skin-asset\/[a-f0-9]{16,64}\.(webp|jpe?g|png)"\)$/.test(b.wp)) {
      d.dataset.wp = "1";
      d.dataset.wpIntensity = ["subtle", "normal", "vivid"].includes(b.intensity) ? b.intensity : "normal";
      d.style.setProperty("--wp-image", b.wp);
    }
    if (["pixel", "win98"].includes(b.look)) d.dataset.look = b.look;
    if (hex.test(b.themeColor || "")) document.getElementById("meta-theme")?.setAttribute("content", b.themeColor);
  } catch (e) { /* 缓存坏了走原生 */ }
})();
</script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand" aria-label="Ownward 首页">ownward<span>/</span></div>
    <nav class="nav-tabs" id="nav-tabs" aria-label="主导航">
      <button class="nav-tab" data-tab="today">今日 <span class="badge" id="b-today"></span></button>
      <button class="nav-tab" data-tab="tasks">任务 <span class="badge" id="b-tasks"></span></button>
      <button class="nav-tab" data-tab="chat">对话</button>
      <button class="nav-tab" data-tab="lark">飞书 <span class="badge" id="b-lark"></span></button>
      <button class="nav-tab" data-tab="mail" data-feature="mail">邮件</button>
      <button class="nav-tab" data-tab="pr">PR <span class="badge" id="b-pr"></span></button>
      <button class="nav-tab" data-tab="roles">角色</button>
      <button class="nav-tab" data-tab="notes">笔记</button>
      <button class="nav-tab" data-tab="settings">设置</button>
      <span class="vertical-nav-desktop" id="vertical-nav-desktop" aria-label="扩展导航"></span>
    </nav>
    <div class="topbar-actions">
      <button class="status-pill mono" id="hb-pill" title="距下次心跳；点击立即心跳" style="display:none"></button>
      <button class="status-pill" id="sys-status" title="查看系统状态"><span class="dot ok" id="live-dot"></span><span id="sys-text"></span></button>
      <button class="button primary" id="btn-work"><span class="btn-label">派新任务</span> <span class="kbd">N</span></button>
      <details class="topbar-more">
        <summary class="icon-btn" title="更多工具" aria-label="更多工具"><svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="16" cy="10" r="1.4"/></svg></summary>
        <div class="topbar-menu">
          <button class="mobile-menu-item" data-tab="lark">飞书</button>
          <button class="mobile-menu-item" data-tab="mail" data-feature="mail">邮件</button>
          <button class="mobile-menu-item" data-tab="pr">PR</button>
          <button class="mobile-menu-item" data-tab="roles">角色</button>
          <button class="mobile-menu-item" data-tab="notes">笔记</button>
          <span class="vertical-nav-mobile" id="vertical-nav-mobile" aria-label="扩展导航"></span>
          <button class="mobile-menu-item" data-tab="feed">通知流 <span class="badge" id="b-feed"></span></button>
          <button data-tab="settings">设置</button>
          <button data-action="triage">立即分流</button>
          <button id="skin-btn">更换皮肤</button>
          <button data-tab="system">系统与运行</button>
        </div>
      </details>
    </div>
  </header>

  <main id="panes">
    <section class="pane-root" data-pane="today"><div class="cols layout-today" id="today-root"></div></section>
    <section class="pane-root" data-pane="feed"><div class="cols layout-feed" id="feed-root"></div></section>
    <section class="pane-root" data-pane="tasks"><div class="cols layout-split" id="tasks-root"></div></section>
    <section class="pane-root" data-pane="chat"><div class="cols layout-split" id="chat-root"></div></section>
    <section class="pane-root" data-pane="lark"><div class="cols layout-split" id="lark-root"></div></section>
    <section class="pane-root" data-pane="mail"><div class="cols layout-split" id="mail-root"></div></section>
    <section class="pane-root" data-pane="pr"><div class="cols layout-split" id="pr-root"></div></section>
    <section class="pane-root" data-pane="roles"><div class="cols layout-split" id="roles-root"></div></section>
    <section class="pane-root" data-pane="notes"><div class="cols layout-notes" id="notes-root"></div></section>
    <section class="pane-root" data-pane="system"><div class="cols layout-system" id="system-root"></div></section>
    <section class="pane-root" data-pane="settings"><div class="settings-layout" id="settings-root"></div></section>
  </main>
</div>

<!-- 浏览器内目录选择（/api/fs/dirs，圈在授权根内）：远程打开 web 时不能弹本机 Finder -->
<div class="overlay" id="dir-overlay">
  <div class="modal" role="dialog" aria-label="选择目录">
    <h2>选择目录</h2>
    <div class="row" style="align-items:center;gap:6px;margin-bottom:6px">
      <button class="button ghost sm" id="dp-up" type="button" title="上一级" aria-label="上一级">↑</button>
      <span class="mono" id="dp-path" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;font-size:12px;color:var(--text-secondary)">授权根目录</span>
    </div>
    <div class="palette-list" id="dp-list" style="max-height:48vh;min-height:120px"></div>
    <div class="actions">
      <button class="button ghost" id="dp-cancel" type="button">取消</button>
      <button class="button primary" id="dp-select" type="button">选择此目录</button>
    </div>
  </div>
</div>
<!-- 给现有会话追加可写目录：交互与「派新任务」的项目目录选择保持一致 -->
<div class="overlay" id="add-dir-overlay">
  <div class="modal" role="dialog" aria-label="追加可写目录">
    <h2>追加可写目录</h2>
    <label>项目目录</label>
    <div class="row dir-input-row" style="align-items:center;gap:6px">
      <input type="text" id="add-dir-input" placeholder="~/workspace/some-repo" spellcheck="false" list="add-dir-list" style="flex:1;margin:0">
      <button class="icon-btn" id="add-dir-browse" title="浏览目录" type="button"><svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 5.5h5l1.5 1.7h7.9v8.3H2.8z"/><path d="M2.8 7.2V4.5h4.5l1.4 1.6"/></svg></button>
    </div>
    <datalist id="add-dir-list"></datalist>
    <div class="dir-add-status" id="add-dir-status"></div>
    <div class="actions">
      <button class="button ghost" id="add-dir-cancel" type="button">完成</button>
      <button class="button primary" id="add-dir-submit" type="button">加入目录</button>
    </div>
  </div>
</div>

<!-- 派新任务 modal -->
<div class="overlay" id="work-overlay">
  <div class="modal" role="dialog" aria-label="派新任务">
    <h2>派新任务</h2>
    <label>项目目录</label>
    <div class="row dir-input-row" style="align-items:center;gap:6px">
      <input type="text" id="w-dir" placeholder="~/workspace/some-repo" spellcheck="false" list="w-dir-list" style="flex:1;margin:0">
      <button class="icon-btn" id="w-browse" title="浏览目录" type="button"><svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 5.5h5l1.5 1.7h7.9v8.3H2.8z"/><path d="M2.8 7.2V4.5h4.5l1.4 1.6"/></svg></button>
    </div>
    <datalist id="w-dir-list"></datalist>
    <div class="extra-dir-row" id="w-extra-wrap" title="后台 agent 可同时读写多个项目">
      <span class="label-hint">附加目录（可选）</span>
      <div class="dir-chips" id="w-extra-chips"></div>
      <span class="label-hint extra-dir-disabled" id="w-extra-disabled" hidden>terminal 模式不支持</span>
      <button class="icon-btn extra-dir-add" id="w-extra-browse" title="添加附加目录" aria-label="添加附加目录" type="button">＋</button>
    </div>
    <label>任务描述</label>
    <textarea id="w-task" placeholder="修复登录页闪退…（可粘贴/拖入图片，仅后台任务）"></textarea>
    <div class="composer-imgs" id="w-imgs" style="padding:6px 0 0"></div>
    <div class="row" style="margin-top:6px">
      <button class="icon-btn" id="w-attach" title="添加图片" type="button">🖼</button>
      <span style="font-size:11px;color:var(--text-tertiary)">图片随任务发给 agent（terminal 模式不支持）</span>
    </div>
    <input type="file" id="w-file" accept="image/*" multiple hidden>
    <div class="row">
      <label style="margin:0;display:flex;gap:5px;align-items:center"><input type="checkbox" id="w-bg" checked> 后台运行</label>
      <label style="margin:0;display:flex;gap:5px;align-items:center">引擎 <select id="w-engine" style="width:110px"><option value="claude">claude</option><option value="codex">codex</option><option value="codebuddy">codebuddy</option></select></label>
      <label style="margin:0;display:flex;gap:5px;align-items:center"><input type="checkbox" id="w-worktree" checked> worktree 隔离</label>
    </div>
    <div class="row">
      <label style="margin:0">模型 <select id="w-model" style="width:130px"><option value="">默认</option></select></label>
      <label style="margin:0">思考深度 <select id="w-effort" style="width:130px"><option value="">默认</option></select></label>
      <label style="margin:0">权限 <select id="w-perm" style="width:110px"><option value="">默认</option><option value="safe">safe（要审批）</option><option value="bypass">bypass</option></select></label>
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--text-tertiary)">后台任务默认 worktree 隔离；terminal 模式会在本机拉起 Terminal 窗口</div>
    <div class="actions">
      <button class="button ghost" id="w-cancel">取消</button>
      <button class="button primary" id="w-submit">派发</button>
    </div>
  </div>
</div>

<!-- routine 草稿 modal -->
<div class="overlay" id="draft-overlay">
  <div class="modal" role="dialog" aria-label="routine 草稿">
    <h2 id="d-title">草稿</h2>
    <textarea id="d-text" style="min-height:300px;font-family:var(--font-mono);font-size:12px"></textarea>
    <div class="actions">
      <button class="button ghost" id="d-cancel">关闭</button>
      <button class="button danger" id="d-skip">跳过本次</button>
      <button class="button secondary" id="d-regen" style="display:none" onclick="regenDraft()">重新生成</button>
      <button class="button secondary" id="d-save">保存草稿</button>
      <button class="button primary" id="d-write">写入文档</button>
    </div>
  </div>
</div>
<!-- 角色新建/编辑 modal（内容由 roles.js 填充） -->
<div class="overlay" id="role-overlay">
  <div class="modal" role="dialog" aria-label="角色">
    <h2 id="r-title">新建角色</h2>
    <div id="r-tpl-wrap">
      <label>从模板开始（可选）</label>
      <div class="pick-row" id="r-templates"></div>
    </div>
    <div id="r-id-wrap">
      <label>角色 id（小写字母/数字/连字符，2–40 位，创建后不可改）</label>
      <input type="text" id="r-id" placeholder="dev" spellcheck="false" autocomplete="off">
    </div>
    <div id="r-scope-wrap" style="display:none">
      <label>归属 scope（创建后不可改，跨 scope 不共享记忆）</label>
      <select id="r-scope"></select>
    </div>
    <label>类型</label>
    <select id="r-type" aria-label="角色类型">
      <option value="lead">职能负责人（跨项目的原则与决策）</option>
      <option value="project">项目专家（完整理解一个主项目）</option>
    </select>
    <p class="modal-note" id="r-type-note"></p>
    <div id="r-org-wrap" style="display:none">
      <label>主项目（必选，对话强制注入它的 README）</label>
      <select id="r-primary"></select>
      <label>上级职能负责人（可选，只能选同 scope 的在岗负责人）</label>
      <select id="r-parent"></select>
    </div>
    <label>名称</label>
    <input type="text" id="r-name" placeholder="研发" maxlength="30">
    <label>一句话描述</label>
    <input type="text" id="r-desc" placeholder="负责 Ownward 与 desk 的工程实现" maxlength="200">
    <label>图标</label>
    <div class="pick-row" id="r-icons"></div>
    <label>主色</label>
    <div class="pick-row">
      <span class="pick-row" id="r-colors"></span>
      <input type="color" id="r-color" value="#5b8def" aria-label="自定义主色">
    </div>
    <label>职责边界（会注入对话，最多 2000 字）</label>
    <textarea id="r-ins" placeholder="负责什么、不负责什么"></textarea>
    <label>关联项目 <span class="label-note" id="r-proj-hint"></span></label>
    <div class="pick-row" id="r-projects"></div>
    <div class="actions">
      <button class="button ghost" id="r-cancel">取消</button>
      <button class="button primary" id="r-save">保存</button>
    </div>
  </div>
</div>
<!-- assistant 消息 → 候选记忆 modal（人工门入口，内容由 chat.js 填充） -->
<div class="overlay" id="cand-overlay">
  <div class="modal" role="dialog" aria-label="存为候选记忆">
    <h2>存为候选记忆</h2>
    <div id="cd-target-wrap" style="display:none">
      <label>存到哪</label>
      <div class="pick-row" id="cd-targets"></div>
    </div>
    <p class="modal-note" id="cd-note"></p>
    <label>候选内容（可改写成一句结论）</label>
    <textarea id="cd-text" style="min-height:170px"></textarea>
    <div class="row" style="justify-content:space-between">
      <span class="label-note">只写进 _candidates/，要到角色页人工晋升才进正式记忆</span>
      <span class="label-note mono" id="cd-count"></span>
    </div>
    <div class="actions">
      <button class="button ghost" id="cd-cancel">取消</button>
      <button class="button primary" id="cd-save">存为候选</button>
    </div>
  </div>
</div>
<!-- 大文本查看 modal（repo diff 等） -->
<div class="overlay" id="text-overlay">
  <div class="modal" style="width:min(920px,96vw)" role="dialog" aria-label="文本查看">
    <h2 id="t-title">查看</h2>
    <pre class="log-view panel" id="t-body" style="max-height:64vh;overflow:auto;margin:0"></pre>
    <div class="actions"><button class="button secondary" id="t-close">关闭</button></div>
  </div>
</div>
<!-- 任务引擎 / 模型 / 思考深度统一配置 dialog（逻辑在 tasks.js） -->
<dialog class="control-dialog session-config-dialog" id="session-config-dialog" aria-labelledby="session-config-title">
  <div id="session-config-body"></div>
</dialog>
<!-- 皮肤选择 modal（内容由 skin.js 渲染） -->
<div class="overlay" id="skin-overlay">
  <div class="modal" style="width:min(680px,96vw)" role="dialog" aria-label="皮肤">
    <h2><svg class="ui-icon heading-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.2a6.8 6.8 0 1 0 0 13.6h1.1a1.7 1.7 0 0 0 0-3.4h-.8a1.2 1.2 0 0 1 0-2.4h3.1a3.4 3.4 0 0 0 3.4-3.4C16.8 5.2 13.8 3.2 10 3.2Z"/><circle cx="6.3" cy="8" r=".8"/><circle cx="8.7" cy="5.9" r=".8"/><circle cx="12" cy="6.1" r=".8"/></svg>皮肤</h2>
    <div id="skin-body"></div>
    <div class="actions"><button class="button secondary" id="skin-close">关闭</button></div>
  </div>
</div>
<input type="file" id="skin-file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif,.heic,.heif" hidden>
<!-- ⌘K 全局搜索/命令面板（逻辑在 app.js） -->
<div class="overlay" id="palette-overlay">
  <div class="modal palette" role="dialog" aria-label="全局搜索">
    <input type="text" id="pal-input" placeholder="搜索 tab / 任务 / 对话 / 笔记，或输入动作…" spellcheck="false" autocomplete="off">
    <div class="palette-list" id="pal-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/app.js"></script>
<script src="/image-viewer.js"></script>
<script src="/skin.js"></script>
<script src="/today.js"></script>
<script src="/feed.js"></script>
<script src="/tasks.js"></script>
<script src="/chat.js"></script>
<script src="/lark.js"></script>
<script src="/mail.js"></script>
<script src="/pr.js"></script>
<script src="/roles.js"></script>
<script src="/notes.js"></script>
<script src="/system.js"></script>
<script src="/settings.js"></script>
<script src="/vertical-navigation.js"></script>
<script>ImageViewer.init();appInit();</script>
</body>
</html>
